# Development: docker compose up -> starts both services. Source code is mounted
#   as a volume, changes are reflected immediately via hot-reload.
#
# Production:  docker build -t dmuster . (no target, defaults to runner).
#   Minimal image (~200MB) with standalone server.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source so that Next.js hot-reload picks up every change.
      - .:/app
      # Anonymous volumes prevent the host mounts from overwriting the
      # node_modules and .next directories installed inside the image.
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-dmuster}:${MYSQL_PASSWORD:-dmuster_pass}@db:3306/${MYSQL_DATABASE:-dmuster}"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      # Optional Google Calendar sync (roadmap #23) — blank is fine, src/lib/env.ts
      # treats an empty value the same as unset and hides the integration.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Fires the CRON_SECRET-protected /api/cron/* sweep routes on a schedule.
  # Entirely inert (just sleeps) when CRON_SECRET is unset — see
  # docker/cron/entrypoint.sh — so no deployment is forced to configure it.
  cron:
    image: alpine:3.22
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./docker/cron/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    # No `ports:` on purpose: the database stays on the compose network, where
    # `app` reaches it at `db:3306`. For an ad-hoc client, go through the
    # container: `docker compose exec db mysql -u"$MYSQL_USER" -p`.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dmuster_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dmuster}
      MYSQL_USER: ${MYSQL_USER:-dmuster}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dmuster_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dmuster_root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
